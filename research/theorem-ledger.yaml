      endpoint_audit: "T=3 and both lower X,Y and upper XY boundaries included; 0<epsilon<1/3 is fixed for the asymptotic assertion."
      smoothing_audit: "Explicit estimate allows varying omega; o(1) for varying weights requires (1+W_inf+W_1)T^(-epsilon)L^4 to vanish."
