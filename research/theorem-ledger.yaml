      label: thm:triple-test-function
      bookkeeping: research/triple-test-functions.md
    constants_effective: true
    all_limit_interchanges_justified: true
    computation_used_in_proof: false
    certificate_artifact_hash: null
    limit_order: "Fix T,phi,omega and remove zero cutoffs under C||phi||_1 B^(1-epsilon)log(2T+2)^3; only then let T grow with phi,epsilon,omega fixed."
    project_audit:
