  - id: PAIR-RHS-MEAN-001
    title: Full unconditional prime-side mean square with separate error scales
    kind: lemma
    statement: |
      Define A(X,t)=X^(-1)log(t+2) for t>=0,
      H=E_arch+E_DS+E_pole+E_trivial using the exact PAIR-EF-001 remainders,
      r(X,t)=-P(X,t)+A(X,t)+H(X,t), R(X,T)=integral_0^T |r(X,t)|^2 dt.
      The explicit formula gives R=L with the existing normalization.
      Uniformly for T>=3,1<=X<=T,
      R(X,T)=T X^(-2)log(T)^2+T log X
        +O(T log(T)/X^2)+O(T sqrt(log T)).
      Constants are absolute effective; both X endpoints are included.
      In particular the prime/archimedean cross term is
      O(log(T+2)/sqrt X), proved by integration by parts.
      Proper prime powers and all four named remainders are retained.
