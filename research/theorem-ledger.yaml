      proof_method: "Six determinant-one quadrant pullbacks, conjugation of negative-sector tests, chain-rule seminorm bounds, incidence accounting and compact-frequency Fourier inversion."
      endpoint_audit: "All internal axes, the diagonal xi+eta=0 and the origin included; h=1 excluded. Identity holds for T>2pi; estimate for T>=2pi e."
      scaling_audit: "Only the extra factor 1/log T; 1/T remains inside K_T. Sector Jacobians are one and diagonal line measure is dr."
      horizontal_audit: "Full complex test arguments and native kernel retained; sector identities do not assert separate preservation of index-diagonal subseries."
