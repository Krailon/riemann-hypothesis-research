  - id: PAIR-NORM-001
    title: Unconditional squared-norm identity retaining horizontal displacements
    kind: lemma
    statement: |
      For X>0 and T>=3 let I_T index every nontrivial zeta zero occurrence
      rho_j=1/2+delta_j+i gamma_j with 0<gamma_j<=T, counting multiplicity.
      Put N(T)=|I_T|, M_X=max(X^(1/2),X^(-1/2)),
      V_{X,T}(t)=sum_{j in I_T} X^(delta_j+i gamma_j)
                            /(1+((t-gamma_j)+i delta_j)^2),
      Phi(X,T)=sum_{j,k in I_T} X^(rho_j-rho_k) 4/(4-(rho_j-rho_k)^2).
      Powers use the real logarithm of X. All ordered pairs are included.
      V is in L^2(R) and Phi(X,T)=(2/pi) integral_R |V_{X,T}(t)|^2 dt.
      For R>=2(T+1), integral_{|t|>R}|V_{X,T}(t)|^2 dt
      <= (512/27) M_X^2 N(T)^2/R^3.
      The identity includes X=1, 0<X<1, repeated zeros, same-ordinate
      distinct complex zeros, and all zero occurrences at gamma=T.
      No RH, simplicity, or quantitative zero-counting estimate is used.
