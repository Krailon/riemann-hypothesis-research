  - id: PAIR-EF-EXACT-001
    title: Exact full-zero explicit formula with continuous endpoint conventions
    kind: proposition
    statement: |
      With S and P as in PAIR-EF-CONVERGENCE-001 and s=1/2+it,
      for all X>=1 and real t,
      S(X,t) = -P(X,t) - X^(-1) zeta'(s-1)/zeta(s-1)
               + 2 X^(1-s)/(s(2-s))
               + 2 sum_{m>=1} X^(-2m-s)/((2m+s-1)(2m+s+1)).
      The last series converges absolutely and locally uniformly on
      [1,infinity) x R. At X=p^k the n=X term in P has weight one.
      The identity is continuous through every prime power and at X=1
      from the right. No value of real t is excluded.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [ZETA-ANALYTIC-001, ZETA-CONTOUR-001, PAIR-EF-CONVERGENCE-001, PAIR-EF-MELLIN-001]
    dependency_graph_complete: false
    source:
      file: proofs/pair_baseline.tex
      label: prop:ef-exact
    constants_effective: true
    all_limit_interchanges_justified: true
    computation_used_in_proof: false
    certificate_artifact_hash: null
    limit_order: "Fixed X>1,t,M; U_j -> infinity; M -> infinity; finally X down to 1 by local domination."
    project_audit:
      task_type: proof
      interchange_justification: |
        Euler series integrated with an explicit integrable majorant;
        horizontal contours O_{X,t,M}(log^2(U_j)/U_j^2);
        left contour O(X^(-a-1/2) log(a+|t|+2)/a), a=2M+1;
        absolute nontrivial-zero residue convergence and trivial majorant 2/m^2;
        endpoint extension by dominated convergence.
      independent_verification: pending

  - id: PAIR-EF-001
    title: Reconstructed unconditional BGSTB Lemma 1 with named uniform remainders
    kind: lemma
    statement: |
      With S and P as in PAIR-EF-CONVERGENCE-001, for all X>=1 and t in R,
      S(X,t) = -P(X,t) + X^(-1) log(|t|+2) + E_arch + E_DS + E_pole + E_trivial.
      Put w=-1/2+it and chi(z)=2^z pi^(z-1) sin(pi z/2) Gamma(1-z).
      E_arch=X^(-1)(-chi'(w)/chi(w)-log(|t|+2)),
      E_DS=X^(-1) zeta'(3/2-it)/zeta(3/2-it),
      E_pole=2 X^(1/2-it)/((1/2+it)(3/2-it)),
      E_trivial=2 sum_{m>=1} X^(-2m-1/2-it)/((2m-1/2+it)(2m+3/2+it)).
      Uniformly, |E_arch|<=C_arch/X, |E_DS|<=C_DS/X,
      |E_pole|<=4 X^(1/2)/(1+t^2),
      |E_trivial|<=12 X^(-5/2)/(|t|+2).
      Effective constants independent of X,t may be chosen as
      C_arch=log(2 pi)+pi+log(2)+2 C_psi/3, with C_psi from
      GAMMA-DIGAMMA-001, and C_DS=sum_{n>=2} Lambda(n)n^(-3/2).
      Thus S=-P+X^(-1)(log(|t|+2)+O(1))
               +O(X^(1/2)/(1+t^2))+O(X^(-5/2)/(|t|+2)).
      All nontrivial zero occurrences, at both signs of the ordinate,
      are included with multiplicity. No RH or simplicity is assumed.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [PAIR-EF-EXACT-001, ZETA-ANALYTIC-001, GAMMA-DIGAMMA-001]
    dependency_graph_complete: false
    source:
      file: proofs/pair_baseline.tex
      label: lem:pair-ef
