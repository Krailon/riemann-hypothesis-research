  - id: TRIPLE-KERNEL-PROFILE-001
    title: Exact rational triple-kernel profile with full horizontal parameters
    kind: lemma
    statement: |
      For real a,b and delta_j,delta_k,delta_l in [-1/2,1/2], put
      z1=a-i delta_j,z2=b-i delta_k,z3=i delta_l,d_mn=z_m-z_n. The absolutely
      convergent profile J(a,b;deltas)=integral_R product_{m=1}^3
      (1+(v-z_m)^2)^(-1) dv equals
      pi(24+d12^2+d13^2+d23^2)/((4+d12^2)(4+d13^2)(4+d23^2)).
      The formula includes coincident centers and the closed horizontal
      endpoints. Re(4+d^2)>=3+(Re d)^2 on this domain, so denominators do
      not vanish. J is smooth with effective uniform derivative bounds
      on compact real-gap sets times the closed horizontal cube.
      Exchanging a,b and delta_j,delta_k preserves J. Negating all three
      deltas conjugates J. For zero tuples a=gamma_j-gamma_l,
      b=gamma_k-gamma_l; the third center reflects the conjugated anchor.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
