claims:
  - id: PAIR-BGSTB-001
    title: Unconditional Montgomery pair theorem with full complex zeros
    kind: imported_theorem
    statement: |
      For T >= 3, let I_T index all occurrences of nontrivial zeta zeros
      rho_j = beta_j + i gamma_j with 0 < gamma_j <= T, including multiplicity.
      For X > 0 define w(z) = 4/(4-z^2),
      Phi(X,T) = sum_{j,k in I_T} exp((rho_j-rho_k) log X) w(rho_j-rho_k),
      C_T = T log(T)/(2 pi), and F_T(alpha) = Phi(T^alpha,T)/C_T.
      All ordered pairs, including equal indices and equal complex zeros,
      are included. For every real alpha, F_T(alpha) is real, even and
      nonnegative. As T -> infinity, uniformly for 0 <= alpha <= 1,
      F_T(alpha) = T^(-2 alpha)(log T + O(1))
                   + alpha + O((log T)^(-1/2)).
      Both endpoints are included; evenness extends this formula using
      |alpha| to -1 <= alpha <= 1. No RH or simplicity assumption is used.
    status: published
    assumptions: [UNCONDITIONAL]
    dependencies:
      - PAIR-EF-001
      - PAIR-COUNT-001
      - PAIR-NORM-001
      - PAIR-POSITIVITY-001
      - PAIR-TRUNC-001
      - BGSTB-ZFR
      - BGSTB-MEAN
    dependency_graph_complete: false
    source:
      file: research/literature-notes/pair-baseline.md
      label: "1. Imported theorem — PAIR-BGSTB-001"
      bibliography_key: BGSTB2024
      version_consulted: arXiv:2306.04799v1
      url: https://arxiv.org/pdf/2306.04799v1
      locator: "Theorem 1, (1.2)-(1.4), page 1"
      publication_doi: 10.4064/aa230612-20-3
    constants_effective: null
    all_limit_interchanges_justified: null
    computation_used_in_proof: false
    certificate_artifact_hash: null
    limit_order: "T -> infinity uniformly over alpha in [0,1]."
    project_audit:
      task_type: exposition_and_source_verification
      statement_checked_against: arXiv_v1_pdf
      publication_metadata_checked: "2026-09-25"
      final_journal_text_comparison: pending
      proof_reconstruction: pending
      rh_contamination_audit: pending
