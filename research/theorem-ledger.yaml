    limit_order: "Tonelli for nonnegative error majorants at fixed T and smoothing; unit and dyadic shell bounds prove finiteness before zero cutoffs are removed. For the correlation limit fix test, support margin and smoothing; varying families must make both errors vanish."
    project_audit:
      task_type: proof
      proof_method: "Freeze the smooth height weight at the anchor; prove a tuplewise convolution bound and an independent summable near/far decomposition using local zero counts. Transfer via the compact-frequency horizontal majorant."
      endpoint_audit: "T=3 included for kernel estimates, T>=2pi e for transfer; near includes |t-gamma_l|=T, far is strict, and far-center has priority over far-anchor. All coincidences included."
      smoothing_audit: "New Wprime_inf=||omega'||_inf is distinct from W_1=||omega'||_1. The two old/new correlation errors retain their stated norms separately."
      horizontal_audit: "Full rational profile and full complex test arguments retained; no delta is set to zero."
