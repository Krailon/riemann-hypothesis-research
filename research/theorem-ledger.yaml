  - id: PAIR-TRUNC-001
    title: Unconditional height truncation with separate uniform errors
    kind: lemma
    statement: |
      For X>=1 let v_rho(t)=X^(delta_rho+i gamma)
      /(1+((t-gamma)+i delta_rho)^2), U_X=sum_rho v_rho,
      U_{X,Z}=sum_{|gamma|<=Z} v_rho, and V_{X,T}=sum_{0<gamma<=T} v_rho.
      Powers use the real logarithm. All sums count occurrences with
      multiplicity and full weight at their included endpoints.
      Define L(X,T)=4 integral_0^T |U_X(t)|^2 dt
      =integral_0^T |S(X,t)|^2 dt, where S is PAIR-EF-CONVERGENCE-001.
      Set B(Z)=max({0} union {delta_rho:|gamma|<=Z}), so 0<=B(Z)<1/2.
      For X>=1,T>=3,Z>=2T, with Phi as in PAIR-NORM-001,
      L(X,T)=2 pi Phi(X,T)+E_trunc+E_height+E_extension, exactly, where
      E_trunc=4 integral_0^T (|U_X|^2-|U_{X,Z}|^2) dt,
      E_height=4 integral_0^T (|U_{X,Z}|^2-|V_{X,T}|^2) dt,
      E_extension=-4 integral_{R outside [0,T]} |V_{X,T}|^2 dt.
      Uniformly,
      |E_trunc|<<XT(log(T+2)log(Z)/Z+log(Z)^2/Z^2)<<XT log(Z)^2/Z,
      |E_height|<<X^(2B(Z))log(T)^3,
      |E_extension|<<X^(2B(Z))log(T)^2, and E_extension<=0.
      Consequently for all X>=1,T>=3 and Z_*=T log(T)^2,
      Phi(X,T)=L(X,T)/(2 pi)+O(X^(2B(Z_*))log(T)^3)+O(X).
      With eta_*(Z)=1/2-B(Z), the first error is
      O(X^(1-2eta_*(Z_*))log(T)^3). It has the same bound with any
      established envelope 0<=eta(Z_*)<=1/2 satisfying B(Z_*)<=1/2-eta(Z_*).
      Constants are absolute and effective, independent of that envelope.
      No quantitative zero-free region, RH or simplicity is assumed.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [PAIR-COUNT-KERNEL-001, PAIR-EF-CONVERGENCE-001, PAIR-NORM-001]
    dependency_graph_complete: false
    source:
