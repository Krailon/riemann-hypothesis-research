  - id: PAIR-TRANSLATION-001
    title: Exact bookkeeping and scale translation for the pair observable
    kind: algebraic_identity
    statement: |
      For T > 2 pi, let I_T, Phi and F_T have the definitions in
      PAIR-BGSTB-001. Put b = beta_j-beta_k, d = gamma_j-gamma_k,
      x_rho = (beta-1/2) log T, L_T = log(T/(2 pi))/(2 pi),
      A_T = log T/(2 pi), q_T = A_T/L_T and u = L_T(gamma_k-gamma_j).
      A summand of Phi(T^alpha,T) equals
      4 exp(alpha(x_rho_j-x_rho_k) + i alpha d log T)
      / (4-b^2+d^2-2 i b d).
      Index-diagonal and equal-complex-zero contributions to Phi are
      respectively N(T) and sum_{distinct z, 0<Im(z)<=T} m(z)^2.
      Reflection rho_k -> 1-conjugate(rho_k) reindexes the full sum to
      use rho_j+conjugate(rho_k)-1, without preserving diagonal subsets.
      Under xi = q_T alpha, the vertical phase is exp(-2 pi i xi u),
      C_T = q_T T L_T, and i A_T(rho_j-rho_k)
      = q_T u + i(x_rho_j-x_rho_k)/(2 pi).
      Defining G_T(xi) = Phi((T/(2 pi))^xi,T)/(T L_T) gives
      G_T(xi) = q_T F_T(xi/q_T); |alpha|<=1 maps to |xi|<=q_T
      and d alpha = d xi/q_T.
      For g in C_c^infinity(R), with the negative-sign 2 pi Fourier
      convention, hat(g)(i A_T(rho_j-rho_k))
      = integral_R g(alpha) T^(alpha(rho_j-rho_k)) d alpha.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: []
    dependency_graph_complete: true
    definitions_from: [PAIR-BGSTB-001]
    source:
      file: research/literature-notes/pair-baseline.md
      label: "2-3. PAIR-TRANSLATION-001"
    constants_effective: true
    all_limit_interchanges_justified: true
    computation_used_in_proof: false
    certificate_artifact_hash: null
    limit_order: "Exact at fixed T; no asymptotic limit or interchange of limits."
    project_audit:
      task_type: exposition
      proof_method: "Expansion, finite reindexing, change of variables."
      interchange_justification: |
        The zero sum is finite for fixed T. Compact support of g gives
        absolute convergence and locally uniform domination for its
        complex Fourier argument. No infinite zero-sum exchange is used.
      independent_verification: pending
      notes: |
        Uses unconditional zero symmetry and finiteness, not the imported
        asymptotic. The RH specialization in the note is a separate
        algebra check under RH, not an unconditional replacement of zeros.
        Computational sanity checks are not part of the written proof.

  - id: ZETA-ANALYTIC-001
    title: Classical analytic structure and functional equation of zeta
    kind: imported_theorem
    statement: |
      Zeta is meromorphic on C with only a simple pole at 1 of residue 1.
      It has simple trivial zeros at -2m (m>=1), all other zeros satisfy
      0<Re(rho)<1, and conjugation preserves zeros with multiplicity.
      For Re(s)>1 its Euler product converges absolutely. Meromorphically,
      zeta(s) = chi(s) zeta(1-s), where
      chi(s) = 2^s pi^(s-1) sin(pi s/2) Gamma(1-s).
      Termwise logarithmic differentiation in Re(s)>1 gives
      -zeta'(s)/zeta(s) = sum_{n>=1} Lambda(n)n^(-s), absolutely and
      locally uniformly there, with Lambda(1)=0.
    status: published
    assumptions: [UNCONDITIONAL]
    dependencies: []
    dependency_graph_complete: false
    source:
      file: proofs/pair_baseline.tex
      label: sec:analytic-inputs
      bibliography_key: DLMF
      locator: "Sections 25.2(i), 25.2(iv), 25.10(i); equation (25.4.2)"
      url: https://dlmf.nist.gov/25.4#E2
    constants_effective: true
    all_limit_interchanges_justified: true
    computation_used_in_proof: false
    certificate_artifact_hash: null
    project_audit:
      task_type: source_verification
      statement_checked: "2026-09-25"
      scope: "Standard analytic input; Euler-product differentiation justified in the draft."
      foundational_reconstruction: not_attempted
      independent_verification: pending

  - id: ZETA-COUNT-001
    title: Riemann-von Mangoldt count with midpoint endpoint convention
    kind: imported_theorem
    statement: |
      Let N_*(v) count nontrivial zeta zeros with 0<Im(rho)<v,
      with multiplicity and half the multiplicity at Im(rho)=v.
      For v>=4, N_*(v) = (v/(2 pi)) log(v/(2 pi)) - v/(2 pi)
                             + O(log v), with an absolute effective constant.
    status: published
