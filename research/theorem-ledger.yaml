      and 1<=X<=T,
      L(X,T)=2 pi Phi(X,T)+O(T)+O(X),
      with absolute effective implied constants. Both X endpoints are
      included; zero occurrences retain full endpoint weight and multiplicity.
      More explicitly, put Z_*=T log(T)^2 and nu=nu_KV(Z_*).
      Then X^(1-2nu)log(T)^3 <= C_* T, where C_*=18!*84^18.
      This is an auxiliary absorption constant, not the complete implied
      constant of the comparison. For T>=5 the named Lemma 4 errors obey
      E_trunc=O(X), E_height=O(T), E_extension=O(T), E_extension<=0.
