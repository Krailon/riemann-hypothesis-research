  - id: PAIR-COUNT-KERNEL-001
    title: Global, distant and boundary rational-kernel estimates from local counts
    kind: lemma
    statement: |
      Write kappa(y)=1/(1+y^2) and sum over all nontrivial zero occurrences.
      K(t)=sum_rho kappa(t-gamma)<<log(|t|+2) for all real t.
      For T>=3,Z>=2T,0<=t<=T,
      sum_{|gamma|>Z} kappa(t-gamma)<<log(Z)/Z.
      For T>=3, put B_T(t)=sum_{gamma<=0 or gamma>T} kappa(t-gamma)
      and A_T^ker(t)=sum_{0<gamma<=T} kappa(t-gamma).
      For 0<=t<=T,
      B_T(t)<<log(T+2)(1/(1+t)+1/(1+T-t)).
      For t outside [0,T],
      A_T^ker(t)<<log(T+2)/(1+dist(t,[0,T])).
      The infinite sums converge absolutely; all constants are absolute
      and effective, uniformly in the displayed parameter ranges.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
