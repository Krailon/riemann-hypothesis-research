  - id: TRIPLE-MAIN-TERM-COMPARISON-001
    title: Exact sine-benchmark identification of the weighted triple main term
    kind: lemma
    statement: |
      For arbitrary complex phi in C_c^infinity({h<1}), with h as in
      TRIPLE-SINE-MEASURE-001, let F be its positive-inverse Fourier transform
      and choose 0<kappa<1 with support phi in h<=1-kappa. Then
      S3[F]=phi(0,0)+integral |r|(phi(r,0)+phi(0,r)+phi(r,-r))dr
      and A[phi]=(3/2)S3[F] exactly. With the smoothing hypotheses and
      observables of TRIPLE-SIGNED-TEST-FUNCTION-001 and
      TRIPLE-KERNEL-LOCALIZATION-001, for T>=2pi e put B=T/(2pi),
      b=log B,q=log T,L=log(2T+2),W_inf=||omega||_inf,W_1=||omega'||_1,
      Wprime_inf=||omega'||_inf. Let E_signed=||phi||_C1(1+W_inf+W_1)
      (b^(-1)+B^(-kappa)L^3),E_kernel=||phi||_1(W_inf+Wprime_inf)B^(-kappa)L^3.
      Uniformly A_T[phi]=(3/2)S3[F]+O(E_signed) and
      A_T^J[phi]=(3/2)S3[F]+O(E_signed+E_kernel), with effective absolute
      constants inherited unchanged. Pairings are bilinear, with central
      inversion removed by evenness of the benchmark distribution, not by
      a symmetry or reality assumption on phi. The finite-height local
      critical normalization remains 3b/(2q), whose limit is 3/2.
      Full complex zero arguments, kernel, horizontal displacements and all
      occurrence-index patterns are retained. No unweighted real-ordinate
      zeta correlation, kernel removal, boundary-support extension or
      weighted zeta cumulant cancellation is asserted.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(h<=1-kappa, 0<kappa<1)"]
    dependencies: [TRIPLE-SINE-MEASURE-001, TRIPLE-SIGNED-TEST-FUNCTION-001, TRIPLE-KERNEL-LOCALIZATION-001, TRIPLE-KERNEL-CRITICAL-SPECIALIZATION-001]
    dependency_graph_complete: false
    source:
