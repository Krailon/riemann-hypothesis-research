  - id: TRIPLE-QUADRANT-LIMIT-001
    title: One-sided axis and origin limit for the native weighted triple correlation
    kind: theorem
    statement: |
      Under TRIPLE-BOUNDARY-ESTIMATES-001 let N_1(psi)=||psi||_{infinity,Q}
      +||partial_xi psi||_{infinity,Q}+||partial_eta psi||_{infinity,Q}.
      Define B_T[psi]=q^(-1)integral_Q psi(xi,eta)C_{3,T}(B^xi,B^eta) dxi deta
      and B_limit[psi]=psi(0,0)/4+(3/4)integral_0^infinity
      r(psi(r,0)+psi(0,r)) dr. For T>=2pi e,
      |B_T[psi]-B_limit[psi]|<<N_1(psi) W (1/b+B^(-kappa)L^3), with an
      effective absolute constant. For fixed psi,kappa,omega the limit is
      B_limit[psi]. The coefficients are full one-sided masses on the
      closed quadrant; no extra half weights are applied.
      F_plus(z1,z2)=integral_Q psi(xi,eta)exp(2pi i(xi z1+eta z2)) dxi deta
      is entire; its Fourier transform on R2 is the zero extension of psi
      as a tempered distribution. It is generally not Schwartz.
      For T>2pi the exact absolutely convergent zero-side identity is
      B_T[psi]=(8/q)sum_{i1,i2,i3 in I} K_T(i2,i3,i1)F_plus(z21,z31), where
      z21=L_T((gamma_i2-gamma_i1)-i(delta_i2+delta_i1)),
      z31=L_T((gamma_i3-gamma_i1)-i(delta_i3+delta_i1)), L_T=log B/(2pi).
      I is the full zero-occurrence multiset, both ordinate signs,
      multiplicities and all partial diagonals included. K_T already
      contains 1/T. The majorant before division by q is
      C||psi||_{L1(Q)} B^(1-kappa)log(2T+2)^3. No signed-sector extension,
      kernel removal, real-ordinate-only correlation, positivity or new
      horizontal consequence is asserted.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(relative support in xi>=0, eta>=0, xi+eta<=1-kappa; 0<kappa<1)"]
    dependencies: [TRIPLE-BOUNDARY-ESTIMATES-001, TRIPLE-MASTER-001]
