  - id: ORDINATE-SIGN-AVERAGE-001
    title: Eight-reflection identity and kernel coefficient bounds
    kind: lemma
    statement: |
      In the ordinate reduction, write mathcalJ(delta)=J(a,d;delta2,delta3,delta1)
      with anchor first, and J_S=(1/8)sum_epsilon prod_{j in S}epsilon_j
      mathcalJ(epsilon delta). Set a1=b delta1(xi+eta), a2=b delta2 xi, a3=b
      delta3 eta, Cj=cosh(aj), Sj=sinh(aj). Exactly (1/8)sum_epsilon
      mathcalJ(epsilon delta)(exp(sum epsilon_j aj)-1)=J_empty(prod Cj-1)+sum_{S
      nonempty}J_S prod_{j in S}Sj prod_{j not in S}Cj. Pairing these two parts
      with c_T omega phi exp(2pi i(u xi+v eta)) and summing gives
      E_arguments=E_even+E_kernel-mix, with absolute Fubini at fixed T.
      Independent reflections preserve the full ordered Cartesian product with
      multiplicity but need not preserve separate index diagonals. Uniformly for
      all real gaps and |delta_j|<=1/2, conjugate(J_S)=(-1)^|S| J_S, J_empty>0,
      |J_S|<=C prod_{j in S}|delta_j| for nonempty S, and odd-cardinality S gain
      the additional factor min(|a|+|d|,1). J_empty is distinct from J_0.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(h<=1-kappa, 0<kappa<1)"]
    dependencies: [ORDINATE-TRANSFER-001, TRIPLE-KERNEL-PROFILE-001, PAIR-COUNT-001]
    dependency_graph_complete: false
