  - id: TRIPLE-BOUNDARY-ESTIMATES-001
    title: Local boundary profiles and integrated positive-quadrant error budget
    kind: lemma
    statement: |
      Let Q=[0,infinity)^2, 0<kappa<1, and let psi be a restriction of a
      compactly supported smooth function on R2 with relative support in
      Q_kappa={(xi,eta) in Q:xi+eta<=1-kappa}. Use the normalized nonnegative
      smoothing of TRIPLE-UNIFORM-001. For T>=2pi e set B=T/(2pi), b=log B,
      q=log T, L=log(2T+2), W=1+||omega||_inf+||omega'||_1, X=B^xi,Y=B^eta,
      Z=XY, and R_T=C_{3,T}-q^3/Z^2-(q+mu_omega)G, with G and mu_omega
      defined in TRIPLE-RETAINED-001. Then integral_Q |psi R_T| dxi deta
      <<||psi||_{infinity,Q} W (1+B^(-kappa)L^4), with an effective absolute
      constant independent of kappa. The budget counts all eight old
      non-H errors, nineteen H words (208 component refinements), E_D,E_J
      and -R_res once. For fixed smoothing, as T tends to infinity,
      q^(-3)C_{3,T}(exp u,exp v) tends uniformly to exp(-2(u+v)) on compact
      subsets of u,v>=0; q^(-2)C_{3,T}(B^r,exp s) tends uniformly to
      r(1+s)exp(-2s) on compact subsets of 0<r<1,s>=0. Exchange X,Y for the
      other axis. The local profiles themselves require no test function.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(relative support in xi>=0, eta>=0, xi+eta<=1-kappa; 0<kappa<1)"]
    dependencies: [TRIPLE-UNIFORM-001, TRIPLE-OFFDIAG-001, TRIPLE-RETAINED-001]
    dependency_graph_complete: false
