  - id: TRIPLE-SIGNED-SECTORS-001
    title: Reciprocal full-zero reflection and six signed frequency sectors
    kind: lemma
    statement: |
      Extend S(x,t) to every x>0 by the full-zero series of TRIPLE-MASTER-001
      and C_{3,T}(X,Y) to X,Y>0 by the same smoothed product. The series is
      absolutely locally uniformly convergent in x>0,t real, and
      S(x^(-1),t)=conjugate(S(x,t)) by multiplicity-preserving horizontal
      reflection. For T>2pi set B=T/(2pi), Ctilde_T(xi,eta)=C_{3,T}(B^xi,B^eta),
      R(xi,eta)=(eta,-xi-eta), and h=max(abs(xi),abs(eta),abs(xi+eta)).
      Ctilde_T(R(xi,eta))=Ctilde_T(xi,eta),
      Ctilde_T(-xi,-eta)=conjugate(Ctilde_T(xi,eta)), and coordinate swap
      preserves Ctilde_T. The six closed cones sigma R^k Q, Q=[0,infinity)^2,
      sigma in {1,-1}, k=0,1,2 cover R2 with disjoint interiors. Their only
      overlaps are on xi eta (xi+eta)=0. All maps have determinant one;
      h(sigma R^k(u,v))=u+v for u,v>=0, and globally
      h=(abs(xi)+abs(eta)+abs(xi+eta))/2. On every seam the integrand is a
      permutation of S(1,t)|S(B^r,t)|^2 and is real, so sector descriptions
      agree. The master full-zero identity extends to all X,Y>0. For any
      integrable phi supported in h<=1-kappa, 0<kappa<1, its integrated
      absolute zero-series majorant is C||phi||_1 B^(1-kappa)log(2T+2)^3,
      before division by log T. Sector identities concern full sums and
      need not preserve individual index-diagonal subseries.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [TRIPLE-MASTER-001, PAIR-COUNT-KERNEL-001]
    dependency_graph_complete: false
