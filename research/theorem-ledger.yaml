  - id: ORDINATE-DENSITY-MIX-001
    title: Vanishing kernel mixing on a smaller fixed support region
    kind: theorem
    statement: |
      Set alpha=331/4000. For fixed 0<s<1/8, phi smooth compactly supported in
      h<=s, omega nonnegative smooth supported in (1,2) of mass one, q=log T and
      W=||omega||infinity, M24,T(s)<<_s W[q^(1+8s)(1+log q)^26+q^28
      T^(s-alpha)+q^29 T^(s-1)]. Consequently |E_kernel-mix|<<_s W
      P24[q^(-1+8s)(1+log q)^26+q^26 T^(s-alpha)+q^27 T^(s-1)]. In particular for
      fixed data and 0<s<alpha the kernel-mixing error is o(1), and the
      ordinate-only target is equivalent to E_even=o(1). The latter estimate is
      not proved. The endpoint s=alpha is excluded, and this is not a claim of
      vanishing kernel mixing for the original full support class. Density is
      applied only to heights [T/2,5T/2]; all remote partners are bounded
      separately by Schwartz decay and unit counts. Constants can depend on s; no
      uniform endpoint limit is asserted.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(h<=s, 0<s<1/8)"]
    dependencies: [ORDINATE-CANCELLATION-BUDGET-001, ORDINATE-DENSITY-INPUT-001, ORDINATE-COUNT-001, ORDINATE-REAL-KERNEL-001, ORDINATE-TRANSFER-001, TRIPLE-SMOOTHED-CORRELATION-001]
