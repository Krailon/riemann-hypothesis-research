  - id: TRIPLE-LOG-GAP-001
    title: Absolute logarithmic-gap bound for integer frequencies
    kind: lemma
    statement: |
      For complex sequences c,d indexed by integers n>=2, define
      B(c)=sum_n |c_n| and E(c)=sum_n n log(2n)|c_n|^2, and similarly
      for d. If these four quantities are finite, then
      sum_{m,n>=2,m!=n} |c_m d_n|/|log(m/n)|
      <= B(c)B(d)/log 2 + 4 sqrt(2) sqrt(E(c)E(d)).
      The sum is over ordered distinct integer frequencies and converges
      absolutely. Repeated frequencies must first be combined.
