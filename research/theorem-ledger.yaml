  - id: TRIPLE-TEST-FUNCTION-001
    title: Interior weighted full-zero test-function correlation with vanishing limit
    kind: theorem
    statement: |
      Let Omega_plus={(xi,eta):xi>0,eta>0,xi+eta<1} and let
      phi in C_c^infinity(Omega_plus) be complex-valued.
      F(z_1,z_2)=integral_R2 phi(xi,eta)exp(2pi i(xi z_1+eta z_2)) dxi deta
      is entire, Schwartz on R2, and has Fourier transform phi in the
      project convention. For T>2pi set B=T/(2pi), L_T=log B/(2pi),
      z_21=L_T((gamma_i2-gamma_i1)-i(delta_i2+delta_i1)),
      z_31=L_T((gamma_i3-gamma_i1)-i(delta_i3+delta_i1)).
      Then R^K_{3,T}[F;omega]=8 sum_{i1,i2,i3 in I}
      K_T(i2,i3,i1)F(z_21,z_31)
      =integral_R2 phi(xi,eta)C_{3,T}(B^xi,B^eta) dxi deta,
      absolutely convergently. I includes every nontrivial zero occurrence,
      both ordinate signs, full multiplicity and all partial diagonals.
      K_T is exactly the master kernel; it already includes 1/T.
      If supp phi is contained in Omega_epsilon={xi>=epsilon,eta>=epsilon,
      xi+eta<=1-epsilon}, 0<epsilon<1/3, then
      |R^K_{3,T}[F;omega]|<<||phi||_1(1+||omega||_inf+||omega'||_1)
      B^(-epsilon)log(2T+2)^4 with an absolute effective constant.
      The statistic tends to zero for fixed phi, support margin and omega.
      Compact subsets of Omega_plus admit such a margin. No extension to
      frequency axes, origin, xi+eta=1, or an unweighted real-ordinate
      statistic is asserted. No positivity, GUE or horizontal conclusion.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(compact subset of xi>0, eta>0, xi+eta<1)"]
    dependencies: [TRIPLE-INTERIOR-VANISHING-001, TRIPLE-MASTER-001]
    dependency_graph_complete: false
    source:
