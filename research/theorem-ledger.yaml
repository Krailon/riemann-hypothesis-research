      proof_method: "Substitution in the rational profile, compact-set derivative estimates, an explicit quadratic Taylor expansion and exact local-spacing normalization."
      endpoint_audit: "Zero gaps, repeated occurrences and closed horizontal endpoints included; L_T=log(T/(2pi))/(2pi), T>2pi."
      horizontal_audit: "General profile retains deltas; only a separately stated kernel parameter specialization sets them to zero."
