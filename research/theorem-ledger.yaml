      rh_contamination_audit: "Neither imported lemma assumes RH or simplicity."
      independent_verification: pending

  - id: GAMMA-DIGAMMA-001
    title: Uniform digamma approximation in a fixed sector
    kind: imported_theorem
    statement: |
      For every fixed epsilon>0, psi(z)=log z+O_epsilon(1/|z|)
      uniformly where |z|>=epsilon and |arg(z)|<pi-epsilon,
      using the principal logarithm. In particular an effective C_psi
      exists such that |psi(z)-log z|<=C_psi/|z| for Re(z)>=3/2.
    status: published
    assumptions: [UNCONDITIONAL]
    dependencies: []
    dependency_graph_complete: false
    source:
