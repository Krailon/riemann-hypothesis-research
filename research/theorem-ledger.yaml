  - id: TRIPLE-RETAINED-001
    title: Evaluation and bounds for the retained triple terms
    kind: lemma
    statement: |
      Under the normalized weight conventions of TRIPLE-UNIFORM-001,
      mu_omega=integral_1^2 omega(u)log u du satisfies 0<=mu_omega<=log 2,
      and 0<=J_1-log T-mu_omega<=2/T for T>=3.
      Uniformly for 1<=a<=b,
      D(a,b)=(a/(2b))(1+log(b/a))log(ab)
      +O((a/b)(1+log(b/a))); use symmetry for reversed arguments.
      Proper prime powers and integer endpoints are included.
      For all X,Y>=1,Z=XY, 0<=R_res(X,Y)<<Z^(-1/2)log(2Z)^3.
      Define G(X,Y)=(1+log Y)log(XZ)/(2Y^2)
      +(1+log X)log(YZ)/(2X^2), and Delta(a,b) as D minus the displayed
      leading expression with its arguments ordered.
      Exactly M_T=q^3/Z^2+(q+mu_omega)G+E_D+E_J-R_res, where q=log T,
      E_D=J_1(Delta(X,Z)/Y+Delta(Y,Z)/X), E_J=(J_1-q-mu_omega)G,
      |E_D|<<log(2T+2)((1+log Y)/Y^2+(1+log X)/X^2),
      and 0<=E_J<=2G/T. Constants are absolute and effective.
      These are additive evaluations, not relative asymptotics.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [TRIPLE-UNIFORM-001, TRIPLE-OFFDIAG-001, PRIME-PNT-001]
