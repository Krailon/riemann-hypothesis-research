      endpoint_audit: "X=1,Y=1,axes,origin and inner support boundary included. T>=2pi e for the budget; local profiles use compact r-subsets strictly inside (0,1). Outer frequency boundary remains excluded."
      smoothing_audit: "Explicit dependence W=1+W_inf+W_1 for the integrated estimate; fixed smoothing for the local-profile limits."
