  - id: ORDINATE-ARGUMENT-BOUND-001
    title: Reflected positive majorant for the complex-argument error
    kind: lemma
    statement: |
      For the supported Fourier tests in the ordinate reduction, let s=1-kappa,
      x=q max_j |delta_ij|, r=max(|u|,|v|), P22(phi)=sum_{|alpha|<=22}
      ||partial^alpha phi||_1, and M_T(s)=(Tq)^(-1) sum omega (1+r)^(-20)
      x^2(1+x)^22 exp(2s x). For T sufficiently large, |E_arguments|<=C P22(phi)
      M_T(s) with an absolute C independent of T,phi,omega,kappa. M_T(s) is finite
      at each fixed T. Simultaneous horizontal reflection cancels the first-order
      term. Neither M_T(s)=o(1) nor E_arguments=o(1) is asserted.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(h<=1-kappa, 0<kappa<1)"]
