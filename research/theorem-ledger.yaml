  - id: QRH-STRIP-001
    title: Formalized reflection and closed horizontal-strip corollaries
    kind: theorem
    statement: |
      Let rho be complex with zeta(rho)=0 and 0<Re(rho)<1. Then 1-rho is
      another zero in the open critical strip, 1/8<=Re(rho)<=7/8, and
      abs(Re(rho)-1/2)<=3/8. The same bounds hold for every member of any
      indexed family of such zeros, with repeated values allowed. There is
      no restriction on the sign of Im(rho), and no simplicity or RH
      hypothesis. The strip endpoints are included. These bounds do not
      assert vanishing of the signed ordinate-reduction error.
    status: formalized
    assumptions: [UNCONDITIONAL]
    dependencies: [QRH-IMPORT-001]
    dependency_graph_complete: false
