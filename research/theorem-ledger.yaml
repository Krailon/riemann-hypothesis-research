      label: sec:analytic-inputs
      bibliography_key: MV2007
      locator: "Appendix C, Theorem C.1, equation (C.17), p.523 and proof pp.523-524"
      url: https://personal.science.psu.edu/rcv4/personal/Publications/MNTI/20.3_pp_520_534_The_gamma_function.pdf
    constants_effective: true
