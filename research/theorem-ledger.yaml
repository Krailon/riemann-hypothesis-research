  - id: ORDINATE-QUADRATIC-001
    title: Full quadratic term after independent horizontal reflections
    kind: lemma
    statement: |
      Let D1=partial_u+partial_v, D2=partial_u, D3=partial_v, and
      K_j=partial_delta_j mathcalJ(0), in anchor-first slot order. The eight-sign
      average of mathcalJ(epsilon delta)[F((u,v)-i y(epsilon delta))-F(u,v)]
      equals Q_delta[F]+R_delta[F], where Q_delta=-(J_0 ell^2/2)sum delta_j^2
      D_j^2 F-i ell sum delta_j^2 K_j D_j F. For x=q max|delta_j|<=1, |R_delta|<=C
      P24(phi)x^4(1+r)^(-20), uniformly for sufficiently large T and the original
      supported test class. The K_j are imaginary and O(min(|a|+|d|,1)). All
      real-plane derivatives are evaluated at (u,v). The remainder bound makes no
      Taylor claim on x>1.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(h<=1-kappa, 0<kappa<1)"]
    dependencies: [ORDINATE-SIGN-AVERAGE-001, ORDINATE-ARGUMENT-BOUND-001]
