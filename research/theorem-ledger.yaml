      bookkeeping: research/triple-master-bookkeeping.md
    constants_effective: true
    all_limit_interchanges_justified: true
    computation_used_in_proof: false
    certificate_artifact_hash: null
    limit_order: "Fix T,X,Y,omega; remove the three zero cutoffs independently or jointly by the integrable kernel majorant; prime cutoffs by absolute convergence. No asymptotic or varying-smoothing limit is taken."
    project_audit:
      task_type: proof
      proof_method: "Absolute-convergence trilinear expansion of the exact pair explicit formula, disjoint index partitions, Fourier substitution, and unique factorization."
      horizontal_audit: "Full delta coordinates retained; simultaneous horizontal reflection reindexes every index subseries. No RH, simplicity or critical-line zero restriction."
      endpoint_audit: "X=1,Y=1,T=3 included; smooth center window, no zero-height truncation. Cutoff endpoints carry full multiplicity."
      verification_script: scripts/check_triple_master.py
      independent_verification: pending
