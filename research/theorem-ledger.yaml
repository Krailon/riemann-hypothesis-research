  - id: PAIR-NORM-INTEGRAL-001
    title: Complex rational integral including coincident poles
    kind: lemma
    statement: |
      For every complex a with |Im(a)|<1, the integral over real u of
      1/((1+u^2)(1+(u+a)^2)) converges absolutely and equals 2 pi/(4+a^2).
      At a=0 its value is pi/2. For the upper semicircle of radius
      R>=4(|a|+1), the integral over the arc has modulus <=16 pi/R^3.
