  - id: ORDINATE-TRIPLE-001
    title: Open conventional all-ordered smoothed ordinate correlation
    kind: target
    statement: |
      Target, not proved: O_T[F]=S3[F]+o(1), with O_T=(T L_T)^(-1) sum
      omega(gamma1/T) F(L_T(gamma2-gamma1),L_T(gamma3-gamma1)), all ordered zero
      occurrences with multiplicity and both ordinate signs, only the anchor
      localized. Fix omega nonnegative smooth supported in (1,2) of mass one, and
      phi in C_c^infinity supported in h<=1-kappa, 0<kappa<1, with F its inverse
      Fourier transform in project units. S3 is the all-ordered sine benchmark
      including the three partial diagonals and total diagonal. The transfer
      identity and real-kernel estimates reduce this target exactly to the
      unresolved signed estimate E_arguments=o(1).
