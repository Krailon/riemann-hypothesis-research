  - id: ORDINATE-COUNT-001
    title: Near and far cumulative triple counts
    kind: lemma
    statement: |
      Let H_T(R) count all ordered zero occurrences with anchor ordinate in [T,2T]
      and max(|L_T(gamma2-gamma1)|,|L_T(gamma3-gamma1)|)<=R. For T sufficiently
      large, H_T(R)<<T q^2 R^2 uniformly 1<=R<=q^(1/4), and H_T(R)<<T q^3(1+R)^4
      for all R>=1, q=log T. With A20(F)=sup (1+max(|u|,|v|))^20 |F(u,v)| and
      W=||omega||infinity, the sums of omega |F| normalized by Tq are <<W A20 q on
      r<=q^(1/4), and <<W A20 q^(-2) on the complementary tail.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [ORDINATE-PAIR-INPUT-001, PAIR-COUNT-001]
