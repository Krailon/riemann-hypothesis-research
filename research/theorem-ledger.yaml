  - id: ZETA-KV-001
    title: Published explicit Korobov-Vinogradov zero-free region
    kind: imported_theorem
    statement: |
      Let nu_KV(u)=1/((55241/1000)(log u)^(2/3)(log log u)^(1/3))
      for real u>=3, with natural logarithms and positive real powers.
      For real sigma,t with |t|>=3 and sigma>=1-nu_KV(|t|),
      zeta(sigma+i t) is nonzero. Both boundary inequalities are inclusive.
      Equivalently every nontrivial zero rho=beta+i gamma with |gamma|>=3
      satisfies beta<1-nu_KV(|gamma|), regardless of multiplicity.
      The coefficient 55241/1000=55.241 and threshold 3 are exact.
      No assertion for 0<|gamma|<3 or for the full finite-height envelope
      B(Z) is included in this imported claim.
    status: published
    assumptions: [UNCONDITIONAL]
    dependencies: [MTY-KV-PROOF, PT-LOW-ZEROS]
    dependency_graph_complete: false
    source:
      file: proofs/pair_baseline.tex
      label: inp:kv
      bibliography_key: MTY2024
      version_consulted: published_version_of_record_2024-01-12
      url: https://link.springer.com/content/pdf/10.1007/s40993-023-00498-y.pdf
      locator: "Theorem 1.1, equation (1.5), p. 2 of 27; proof in Section 5"
      publication_doi: 10.1007/s40993-023-00498-y
    constants_effective: true
    all_limit_interchanges_justified: null
    computation_used_in_proof: true
    certificate_artifact_hash: null
    limit_order: "Pointwise theorem for every |t|>=3; no project limit interchange is used in importing its statement."
    project_audit:
      task_type: source_verification
      statement_checked: "2026-09-26"
      statement_checked_against: publisher_html_and_version_of_record_pdf
      publication_metadata_checked: "2026-09-26"
      final_journal_text_comparison: completed_for_statement
      endpoint_audit: "Closed zero-free boundary implies strict beta inequality; |t|=3 included; smaller heights not covered."
      rh_contamination_audit: "Theorem 1.1 is unconditional. Its finite-height RH verification is a published computational theorem, not an unproved RH assumption."
