  - id: ORDINATE-TRANSFER-001
    title: Absolutely convergent signed ordinate transfer
    kind: lemma
    statement: |
      With all definitions in proofs/triple_ordinate_reduction.tex, for T>=2pi e,
      smooth nonnegative anchor weight omega of mass one supported in (1,2), and
      phi smooth compactly supported in h<=1-kappa, set O_T=(T L_T)^(-1) sum omega
      F(u,v). All ordered zero occurrences of both signs are included. Define
      E_arguments=c_T sum omega J_delta(F(z)-F(u,v)), E_horizontal=c_T sum omega
      (J_delta-J_0)F(u,v), E_gaps=c_T sum omega (J_0-3pi/8)F(u,v), with
      c_T=16/(3Tq), q=log T, b=log(T/(2pi)). All sums converge absolutely at fixed
      T. Exactly R_T^J=(b/q)O_T+E_arguments+E_horizontal+E_gaps, and
      O_T-S3=(q/b)(R_T^J-S3-E_arguments-E_horizontal-E_gaps)+(q/b-1)S3.
      Independent zero cutoffs are removed first at fixed T.
