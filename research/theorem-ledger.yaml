  - id: TRIPLE-KERNEL-CRITICAL-SPECIALIZATION-001
    title: Microscopic horizontal profile and isolated critical-line specialization
    kind: corollary
    statement: |
      Put h12=delta_j-delta_k,h13=delta_j+delta_l,h23=delta_k+delta_l.
      J(0,0;deltas)=pi(24-h12^2-h13^2-h23^2)/
      ((4-h12^2)(4-h13^2)(4-h23^2)). For each fixed R>0, uniformly for
      |u|,|v|<=R and deltas in [-1/2,1/2]^3, as T tends to infinity,
      J(u/L_T,v/L_T;deltas)=J(0,0;deltas)+O_R(1/L_T).
      At the restricted kernel parameters deltas=0,
      J(a,b;0)=pi(24+a^2+b^2+(a-b)^2)/
      ((4+a^2)(4+b^2)(4+(a-b)^2)), and
      J(u/L_T,v/L_T;0)=3pi/8-5pi(u^2+v^2-uv)/(32L_T^2)+O_R(L_T^(-4)).
      Thus for a critical-line tuple with these bounded scaled gaps,
      K_T=(3pi/(8T))omega(gamma_l/T)+
      O_R(W_inf/(T L_T^2)+Wprime_inf/T^2).
      Constants are effective, with horizontal uniformity in the general
      expansion. Exactly (8/(T log T))(3pi/8)=
      (3 log(T/(2pi))/(2 log T))/(T L_T), whose coefficient tends to 3/2.
      This is an unconditional parameter specialization or a formula on
      tuples already known to lie on the line. Applying the specialization
      to every zero tuple would require RH and is not used in preceding
      claims. No global constant-kernel replacement, GUE identification or
      horizontal consequence follows from these local expansions alone.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [TRIPLE-KERNEL-PROFILE-001, TRIPLE-KERNEL-LOCALIZATION-001]
    dependency_graph_complete: false
    source:
