      endpoint_audit: "Smooth restrictions have continuous boundary traces; axes,origin and Q_kappa boundary included. No half masses. Outer line xi+eta=1 excluded."
      scaling_audit: "b=log(T/(2pi)),q=log T, origin Jacobian b^(-2), transverse axis Jacobian b^(-1); only the extra 1/q normalization is introduced."
