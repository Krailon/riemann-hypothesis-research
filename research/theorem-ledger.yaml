  - id: PAIR-POSITIVITY-001
    title: Reality, nonnegativity and inversion symmetry of the full pair sum
    kind: corollary
    statement: |
      With Phi as in PAIR-NORM-001, for every X>0,T>=3, Phi(X,T) is real
      and nonnegative, and Phi(X^(-1),T)=Phi(X,T).
      Therefore F_T(alpha)=Phi(T^alpha,T)/(T log(T)/(2 pi)) is real,
      nonnegative and even for all real alpha. No asymptotic is used.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [PAIR-NORM-001]
    dependency_graph_complete: false
    source:
      file: proofs/pair_baseline.tex
      label: cor:pair-positivity
    constants_effective: true
    all_limit_interchanges_justified: true
    computation_used_in_proof: false
