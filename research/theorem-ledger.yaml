  - id: ZETA-CONTOUR-001
    title: Unconditional logarithmic-derivative estimates for contour shifts
    kind: imported_theorem
    statement: |
      For every real H>=2 there is U in [H,H+1], avoiding zero ordinates,
      with zeta'(sigma+iU)/zeta(sigma+iU) = O((log H)^2) uniformly
      for -1<=sigma<=2. Conjugation gives the corresponding bound at -U.
      Also zeta'(z)/zeta(z) = O(log(|z|+1)) uniformly for Re(z)<=-1
      and |z+2m|>=1/4 for all positive integers m.
      The implicit constants are absolute and effective.
    status: published
    assumptions: [UNCONDITIONAL]
    dependencies: []
    dependency_graph_complete: false
    source:
      file: proofs/pair_baseline.tex
      label: sec:analytic-inputs
      bibliography_key: MV2007
      locator: "Chapter 12, Lemma 12.2 p.398 and Lemma 12.4 pp.399-400"
      url: https://personal.science.psu.edu/rcv4/personal/Publications/MNTI/16.0_pp_397_418_Explicit_formulae.pdf
    constants_effective: true
    all_limit_interchanges_justified: null
    computation_used_in_proof: false
    certificate_artifact_hash: null
    project_audit:
