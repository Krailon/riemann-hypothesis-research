      horizontal_audit: "Imaginary shifts retain sums of deltas; the conjugated anchor kernel and full multiplicities are unchanged."
      endpoint_audit: "T>2pi is strict. Omega_epsilon boundaries are included, but axes and the outer Omega_plus boundary are excluded."
      scaling_audit: "theta_T=log(T/(2pi))/log T, epsilon_T=epsilon theta_T; use the margin-uniform pointwise bound and T^(-epsilon_T)=(T/(2pi))^(-epsilon). No extra Jacobian or L_T^2."
