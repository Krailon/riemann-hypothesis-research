  - id: TRIPLE-OFFDIAG-001
    title: Decaying mixed-prime and cubic off-diagonal bounds
    kind: lemma
    statement: |
      Under the hypotheses and signed error definitions of TRIPLE-UNIFORM-001,
      for all T>=3,X,Y>=1,Z=XY, ell_x=log(2x), W_1=||omega'||_1,
      |E_PPP,off| << W_1 Z ell_Z^4/T,
      |E_PAP,off| << (Omega_{1,1}/T)(X/sqrt(Y))(ell_X ell_Z)^(3/2),
      |E_APP,off| << (Omega_{1,1}/T)(Y/sqrt(X))(ell_Y ell_Z)^(3/2).
      Here Omega_{1,1}<=W_1 log(2T+2)+1. All implied constants are
      absolute and effective; no restriction Z<=2T is needed.
      In the proof, c_{X,Y}(r)=sum_{mn=r,m,n>=2} a_X(m)a_Y(n)
      combines all ordered repeated product frequencies, with
      B(c_{X,Y})=B(a_X)B(a_Y) and
      c_{X,Y}(r)<=r^(-1/2)min(r/Z,Z/r)(log r)^2.
      For K_k=1+2 sum_{j>=0}2^(-j)(j+2)^k,
      E(a_x)<=K_3 x ell_x^3 and E(c_{X,Y})<=K_5 Z ell_Z^5.
      The exact cubic diagonal remains sum_r c_{X,Y}(r)a_Z(r)=R_res;
      its sign in the retained expression is negative.
    status: proved-draft
