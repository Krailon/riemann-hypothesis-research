  - id: ORDINATE-REAL-KERNEL-001
    title: Vanishing kernel errors for real Schwartz arguments
    kind: theorem
    statement: |
      For every Schwartz F on R^2 and fixed nonnegative smooth omega supported in
      (1,2) of integral one, the signed errors defined in equations (horizontal)
      and (gaps) of the ordinate reduction satisfy |E_gaps|<<W A20(F)/q and
      |E_horizontal|<<W A20(F)(log q)^2/q, q=log T, for T sufficiently large.
      Constants and lower threshold are independent of F and omega. Horizontal
      reflection is performed on the entire ordered tuple sum before a
      second-order Taylor bound; bad zeros at |delta|>64 log q/q are bounded by
      the imported density theorem. All multiplicities and partial diagonals
      remain. No support restriction is needed for these real-test estimates. This
      does not bound E_arguments.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [ORDINATE-TRANSFER-001, ORDINATE-COUNT-001, ORDINATE-DENSITY-INPUT-001]
