  - id: PAIR-MEANVALUE-001
    title: Fourier mean-value bound with a strict nearby-frequency cutoff
    kind: lemma
    statement: |
      Let M be a countable set of distinct real frequencies and c_mu complex
      with sum_mu |c_mu| finite. Put F(t)=sum_mu c_mu exp(2 pi i mu t),
      D=sum_mu |c_mu|^2. For T>=1 and 1/(2T)<=delta<=1/2,
      integral_0^T |F(t)|^2 dt =
      T D + O(delta^(-1) D
        + T sum_{mu,lambda in M,0<|mu-lambda|<delta} |c_mu c_lambda|).
      The pairs are ordered. Constants are absolute and effective.
      Repeated frequencies must first be combined.
