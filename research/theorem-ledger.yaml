  - id: PAIR-ENVELOPE-001
    title: Explicit finite-height horizontal envelope including low ordinates
    kind: lemma
    statement: |
      For every real Z>=3 define
      nu_KV(Z)=1/((55241/1000)(log Z)^(2/3)(log log Z)^(1/3)),
      with natural logarithms and positive real powers, and
      B(Z)=max({0} union {delta_rho:|gamma|<=Z}), eta_*(Z)=1/2-B(Z),
      where rho=1/2+delta_rho+i gamma runs over all nontrivial zero
      occurrences with multiplicity and full weight at both endpoints.
      Then 0<nu_KV(Z)<1/2, B(Z)<1/2-nu_KV(Z), and eta_*(Z)>nu_KV(Z).
      Every retained occurrence satisfies
      |delta_rho|<=B(Z)<1/2-nu_KV(Z).
      The bounds for B and eta_* include an empty zero set, where B(Z)=0.
      There are no nontrivial real zeros; occurrences with 0<|gamma|<3
      have delta_rho=0 by ZETA-LOW-001 and conjugation.
      The function nu_KV is strictly decreasing on [3,infinity).
      Thus eta(Z)=nu_KV(Z) is an admissible envelope in PAIR-TRUNC-001,
      including at Z_*=T log(T)^2 for every T>=3.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [ZETA-KV-001, ZETA-LOW-001, PAIR-COUNT-001, ZETA-ANALYTIC-001]
