  - id: PAIR-PRIME-COUNT-001
    title: Averaged von Mangoldt pair counts and weighted nearby frequencies
    kind: lemma
    statement: |
      For real U>=2,V>=1,
      sum_{1<=m,n<=U,0<|m-n|<=V} Lambda(m)Lambda(n) << U V.
      For 0<=V<1 the sum is empty. For X>=1,0<delta<=1/2 and
      a_X(n)=Lambda(n)n^(-1/2)min(n/X,X/n),
      Q(X,delta)=sum_{m,n>=1,0<|log(n/m)|<2 pi delta} a_X(n)a_X(m)
      << delta X. All pairs are ordered; constants are absolute effective.
      Odd prime shifts and all pairs involving proper prime powers are included.
