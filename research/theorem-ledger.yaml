  - id: TRIPLE-SMOOTHED-ADDITIVE-001
    title: Uniform additive smoothed triple formula on an interior growing range
    kind: corollary
    statement: |
      Let 0<epsilon<1/3, T>=3, T^epsilon<=X,Y, and Z=XY<=T^(1-epsilon).
      For every admissible nonnegative omega from TRIPLE-MASTER-001,
      with W_inf=||omega||_inf, W_1=||omega'||_1, L=log(2T+2), and
      M_T=(log T)^3/Z^2+J_1 D(X,Z)/Y+J_1 D(Y,Z)/X-R_res(X,Y),
      |C_{3,T}(X,Y)-M_T| <= C(1+W_inf+W_1)T^(-epsilon)L^4,
      for an absolute effective constant C independent of
      epsilon,T,X,Y,omega. The sum of the nineteen remainder-containing
      word errors is << (1+W_inf)T^(-epsilon)L^2.
      For fixed epsilon and fixed omega, C_{3,T}=M_T+o(1) uniformly
      on this parameter range, including its X,Y,Z boundaries.
      This is an additive approximation, not a relative o(M_T) error.
      J_1,D,R_res remain exact; no general test-function correlation,
      Fourier-support region, GUE main term or horizontal consequence
      is asserted. No epsilon=0 or varying-epsilon limit is claimed.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [TRIPLE-UNIFORM-001, TRIPLE-OFFDIAG-001]
    dependency_graph_complete: false
