  - id: TRIPLE-SIGNED-TEST-FUNCTION-001
    title: Native weighted full-zero Schwartz correlation with hexagonal Fourier support
    kind: theorem
    statement: |
      Let H={(xi,eta):h(xi,eta)<1}, h=max(abs(xi),abs(eta),abs(xi+eta)),
      and let phi in C_c^infinity(H) be arbitrary complex-valued. Its entire
      inverse Fourier transform F is Schwartz on R2 with Fourier transform
      phi in the negative-forward, positive-inverse 2pi convention. For
      T>2pi set B=T/(2pi),q=log T,b=log B,L=log(2T+2), and
      A_T[phi]=q^(-1)integral_R2 phi(xi,eta)C_{3,T}(B^xi,B^eta) dxi deta.
      Exactly and absolutely convergently,
      A_T[phi]=(8/q)sum_{i1,i2,i3 in I} K_T(i2,i3,i1)F(z21,z31), where
      z21=L_T((gamma_i2-gamma_i1)-i(delta_i2+delta_i1)),
      z31=L_T((gamma_i3-gamma_i1)-i(delta_i3+delta_i1)), L_T=log B/(2pi).
      The full occurrence multiset, both ordinate signs, multiplicities,
      conjugated anchor and all partial diagonals are included.
      Define A[phi]=(3/2)phi(0,0)+(3/2)integral_R abs(r)
      (phi(r,0)+phi(0,r)+phi(r,-r)) dr. For support in h<=1-kappa,
      0<kappa<1, and T>=2pi e,
      |A_T[phi]-A[phi]|<<||phi||_{C1}(1+||omega||_inf+||omega'||_1)
      (1/b+B^(-kappa)L^3) with an effective absolute constant independent
      of kappa. The C1 norm is the sum of the sup norms of phi and its two
      first partial derivatives. Thus A_T tends to A for fixed phi,kappa,omega.
      Every compact subset of H admits such a margin. Each of the six
      sectors contributes an origin mass 1/4 and each ray has two incident
      sectors with coefficient 3/4. No additional half weights are applied.
      All line integrals use parameter r and measure dr, including (r,-r),
      not Euclidean arclength. No RH, simplicity, test symmetry or positivity
      is required. The outer boundary h=1, kernel removal, GUE identification
      and horizontal extraction are not established by this theorem.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(compact subset of max(abs(xi),abs(eta),abs(xi+eta))<1)"]
    dependencies: [TRIPLE-SIGNED-SECTORS-001, TRIPLE-QUADRANT-LIMIT-001]
    dependency_graph_complete: false
    source:
      file: proofs/triple_explicit_formula.tex
      label: thm:triple-signed-test-function
      bookkeeping: research/triple-test-functions.md
