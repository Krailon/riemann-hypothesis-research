  - id: ORDINATE-CANCELLATION-BUDGET-001
    title: Even and kernel-mixing signed error bounds
    kind: theorem
    statement: |
      For 0<s=1-kappa<1 define P24=sum_{|alpha|<=24}||partial^alpha phi||_1 and
      M24,T(s)=(Tq)^(-1)sum omega (1+r)^(-20)x^2(1+x)^24 exp(2s x). With the
      definitions of ORDINATE-SIGN-AVERAGE-001, |E_even|<=C P24 M24,T and
      |E_kernel-mix|<=C P24 M24,T/q^2, with absolute constants for sufficiently
      large T. These bounds also hold for restriction to any
      horizontal-reflection-invariant tuple set with its restricted moment. For
      fixed m>0, on x<=m the errors are respectively O_m(W P24 q) and O_m(W
      P24/q), W=||omega||infinity. On x<=epsilon<=1 the normalized summed
      quadratic remainder is O(W P24 q epsilon^4). These are bounds, not an
      assertion that E_even or the unrestricted kernel-mixing error vanishes in
      the original support class.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(h<=1-kappa, 0<kappa<1)"]
    dependencies: [ORDINATE-SIGN-AVERAGE-001, ORDINATE-QUADRATIC-001, ORDINATE-COUNT-001]
