  - id: PAIR-COUNT-001
    title: Inclusive and local zero counts with full endpoint multiplicities
    kind: lemma
    statement: |
      Let N(v) count every nontrivial zeta zero occurrence with 0<gamma<=v.
      Uniformly for v>=3,
      N(v)=v log(v/(2 pi))/(2 pi)-v/(2 pi)+O(log v),
      and N(v)~v log(v)/(2 pi) as v->infinity.
      An absolute effective C_count exists such that, for every real v,
      #{rho:v<=gamma<=v+1}<=C_count log(|v|+2), with full endpoint
      multiplicities. For V>=2, #{rho:|gamma|<=V}<<V log(V+2).
      There are no nontrivial zeros with gamma=0, as established by
      the locally uniformly convergent paired alternating series.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [ZETA-COUNT-001, ZETA-ANALYTIC-001]
