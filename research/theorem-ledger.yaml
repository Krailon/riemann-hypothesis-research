  - id: PAIR-ASYMPTOTIC-001
    title: Uniform unconditional normalized pair-correlation asymptotic
    kind: theorem
    statement: |
      For T>=3 let I_T index every nontrivial zero occurrence
      rho_j=beta_j+i gamma_j with 0<gamma_j<=T, counted with multiplicity
      and full endpoint weight. Define C_T=T log(T)/(2 pi) and
      F_T(alpha)=C_T^(-1) sum_{j,k in I_T}
        4 T^(alpha(rho_j-rho_k))/(4-(rho_j-rho_k)^2).
      All ordered pairs are included, including equal indices and equal
      complex zeros. F_T is real, nonnegative and even for every real alpha.
      There exist absolute effective C_1,C_2>0 such that for every T>=3
      and |alpha|<=1,
      |F_T(alpha)-T^(-2|alpha|)log T-|alpha||
        <= C_1 T^(-2|alpha|)+C_2(log T)^(-1/2).
      Equivalently F_T(alpha)=T^(-2|alpha|)(log T+O(1))
        +|alpha|+O((log T)^(-1/2)), uniformly on this closed range.
      In particular F_T(0)=log T+O(1) and
      F_T(1)=F_T(-1)=1+O((log T)^(-1/2)).
      No RH or simplicity assumption is used.
    status: proved-draft
    assumptions: [UNCONDITIONAL]
    dependencies: [PAIR-COMPARE-001, PAIR-RHS-MEAN-001, PAIR-POSITIVITY-001]
    dependency_graph_complete: false
