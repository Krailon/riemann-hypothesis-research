  - id: TRIPLE-KERNEL-LOCALIZATION-001
    title: Summable height-localization error and explicit-profile correlation
    kind: lemma
    statement: |
      For T>=3, all full zero occurrences satisfy
      K_T(j,k,l)=omega(gamma_l/T)J(gamma_j-gamma_l,gamma_k-gamma_l;
      delta_j,delta_k,delta_l)/T+E_kernel(j,k,l). With W_inf=||omega||_inf,
      Wprime_inf=||omega'||_inf,L=log(2T+2), the uniform tuplewise bound is
      |E_kernel|<=64pi Wprime_inf/(27T^2(4+(gamma_j-gamma_k)^2)).
      Separately, sum_{j,k,l}|E_kernel|<<(Wprime_inf L^4+W_inf L^3)/T.
      The near, far-center and far-anchor error integrals form a disjoint
      decomposition; their summed bounds are Wprime_inf L^4/T,
      W_inf L^3/T and W_inf L^3/T. Both ordinate signs, all multiplicities
      and all index patterns are included. Constants are effective and
      absolute. The tuplewise estimate alone is not used to sum errors.
      For the tests of TRIPLE-SIGNED-TEST-FUNCTION-001 let phi=Fourier(F),
      B=T/(2pi),q=log T and support phi in h<=1-kappa,0<kappa<1.
      Define A_T^J[phi]=(8/(Tq))sum_{i1,i2,i3 in I}omega(gamma_i1/T)
      J(gamma_i2-gamma_i1,gamma_i3-gamma_i1;delta_i2,delta_i3,delta_i1)
      F(z21,z31), with the same complex test arguments and anchor as before.
      The series is absolutely convergent. For T>=2pi e,
      |A_T[phi]-A_T^J[phi]|<<||phi||_1(W_inf+Wprime_inf)B^(-kappa)L^3.
      A_T^J therefore inherits the existing signed-test main term, with
      error the sum of this new bound and that theorem's error. The kernel
      estimates themselves require no Fourier-support assumption.
    status: proved-draft
    assumptions: [UNCONDITIONAL, "SUPPORT(h<=1-kappa, 0<kappa<1; correlation consequence only)"]
    dependencies: [TRIPLE-KERNEL-PROFILE-001, TRIPLE-MASTER-001, PAIR-COUNT-001, PAIR-COUNT-KERNEL-001, TRIPLE-SIGNED-SECTORS-001, TRIPLE-SIGNED-TEST-FUNCTION-001]
    dependency_graph_complete: false
    source:
